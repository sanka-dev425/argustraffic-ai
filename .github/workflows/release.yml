name: Release Build & Publish Software

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Distribution
    runs-on: windows-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install -e .

      - name: Run Test Suite Verification
        run: python -m pytest tests/ -v

      - name: Create Output Directory
        run: |
          if (-not (Test-Path Output)) { New-Item -ItemType Directory -Path Output -Force }

      - name: Compile PyInstaller Standalone Executable
        run: pyinstaller argustraffic.spec --noconfirm

      - name: Compile Inno Setup Enterprise Installer
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if (-not $iscc) {
            $candidates = @(
              "C:\ProgramData\chocolatey\bin\iscc.exe",
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 7\ISCC.exe"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) { $iscc = $c; break }
            }
          }
          if ($iscc) {
            Write-Host "[+] Compiling installer via $iscc..."
            & $iscc installer_inno.iss
          } else {
            Write-Error "Inno Setup compiler (ISCC.exe) not found!"
            exit 1
          }

      - name: Generate Checksums Manifest
        run: |
          Get-FileHash -Algorithm SHA256 Output\ArgusTraffic_Setup.exe | ForEach-Object { "$($_.Hash) *ArgusTraffic_Setup.exe" } | Out-File -Encoding ascii Output\SHA256SUMS.txt

      - name: Archive Portable Binary Distribution
        run: |
          Compress-Archive -Path dist\ArgusTraffic\* -DestinationPath Output\ArgusTraffic_Portable_v2.0.0.zip -Force
          Get-FileHash -Algorithm SHA256 Output\ArgusTraffic_Portable_v2.0.0.zip | ForEach-Object { "$($_.Hash) *ArgusTraffic_Portable_v2.0.0.zip" } | Out-File -Encoding ascii -Append Output\SHA256SUMS.txt

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "ArgusTraffic AI Enterprise ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body_path: Output/RELEASE_NOTES.md
          files: |
            Output/ArgusTraffic_Setup.exe
            Output/ArgusTraffic_Portable_v2.0.0.zip
            Output/SHA256SUMS.txt
          draft: false
          prerelease: false
